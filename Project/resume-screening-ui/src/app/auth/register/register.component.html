<div class="auth-wrap">
  <div class="auth-card card">
    <h1>Create account</h1>
    <p class="hint">Choose HR Admin to manage jobs, or Viewer for read-only.</p>
    @if (errorMsg) {
      <div class="alert-error">{{ errorMsg }}</div>
    }
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" type="text" formControlName="fullName" autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="role">Role</label>
        <select id="role" formControlName="role">
          <option value="Viewer">Viewer</option>
          <option value="HRAdmin">HR Admin</option>
        </select>
      </div>
      <button class="btn btn-primary full" type="submit" [disabled]="loading">
        {{ loading ? 'Creating…' : 'Register' }}
      </button>
    </form>
    <p class="footer">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
